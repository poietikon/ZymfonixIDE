# Build, verify and publish a Zymfonix IDE release on GitHub Releases.
#
# Start it either way:
#   - push a tag:    git tag v1.140.001 && git push origin v1.140.001
#   - or by hand:    Actions > Release > Run workflow (version optional;
#                    empty = next revision for the pinned Code OSS version)
#
# The release is created as a draft, all assets are uploaded, and only then is
# it published. If any platform or check fails, nothing is published.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.140.001 (empty = next revision)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-$( scripts/next-version.sh )}"
            if git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null; then
              [[ "$( git rev-parse "v${VERSION}^{commit}" )" == "${GITHUB_SHA}" ]] \
                || { echo "::error::tag v${VERSION} already exists on another commit"; exit 1; }
            fi
          fi
          # lib.sh rejects versions that do not match the pinned Code OSS version.
          RELEASE_VERSION="${VERSION}" bash -c '. scripts/lib.sh && echo "ok: ${RELEASE_VERSION} (Code OSS ${MS_TAG_PINNED})"'
          [[ "${VERSION}" != *00 ]] || { echo "::error::revision 00 is reserved for test builds"; exit 1; }
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists"; exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO_PATH: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Verify the complete asset set
        run: scripts/verify-assets.sh dist

      - name: Release notes
        run: |
          PREVIOUS="$( git tag --list 'v*' --sort=-v:refname | grep -vxF "v${RELEASE_VERSION}" | head -n 1 || true )"
          scripts/release-notes.sh "${PREVIOUS}" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=( --draft --title "Zymfonix IDE ${RELEASE_VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" )
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then ARGS+=( --verify-tag ); else ARGS+=( --target "${GITHUB_SHA}" ); fi
          gh release create "v${RELEASE_VERSION}" "${ARGS[@]}" dist/*

      - name: Check uploaded assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPLOADED="$( gh release view "v${RELEASE_VERSION}" --json assets --jq '.assets[].name' | sort )"
          EXPECTED="$( find dist -maxdepth 1 -type f -printf '%f\n' | sort )"
          if [[ "${UPLOADED}" != "${EXPECTED}" ]]; then
            echo "::error::uploaded assets differ from the verified set; the release stays a draft"
            diff <( echo "${EXPECTED}" ) <( echo "${UPLOADED}" ) || true
            exit 1
          fi
          gh release edit "v${RELEASE_VERSION}" --draft=false --latest
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
